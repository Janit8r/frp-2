name: Build AList WebAssembly

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'  # WebAssembly编译需要Go 1.17+
          check-latest: true

      - name: Create workspace directory
        run: mkdir -p workspace

      - name: Download ZIP package
        run: |
          curl -L -o alist-wasm.zip ${{ secrets.ZIP_URL || 'https://your-default-zip-url.com/alist-wasm.zip' }}
          # 在GitHub仓库设置中添加ZIP_URL secret指向你的zip文件

      - name: Extract ZIP file
        run: unzip alist-wasm.zip -d workspace

      - name: Debug - List workspace directory contents
        run: |
          ls -la workspace
          find workspace -name "wasm.go" -type f | sort
          find workspace -name "worker.js" -type f | sort
          find workspace -name "kv_helpers.js" -type f | sort

      - name: Navigate to correct directory
        run: |
          # 根据解压后的目录结构，找到包含WebAssembly源文件的目录
          WASM_DIR=$(find workspace -name "wasm.go" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$WASM_DIR" ]; then
            echo "错误: 找不到wasm.go文件，请检查ZIP包的目录结构"
            exit 1
          else
            echo "找到wasm.go目录: $WASM_DIR"
            echo "WASM_DIR=$WASM_DIR" >> $GITHUB_ENV
            
            # 检查必要文件是否存在
            ls -la $WASM_DIR/wasm.go || echo "wasm.go文件不存在"
            ls -la $WASM_DIR/worker.js || echo "worker.js文件不存在"
            ls -la $WASM_DIR/kv_helpers.js || echo "kv_helpers.js文件不存在"
          fi
          
          # 检查go.mod是否存在，如果不存在，查找上层目录
          if [ ! -f "$WASM_DIR/go.mod" ]; then
            echo "在WebAssembly源目录中找不到go.mod，尝试查找上层目录..."
            GO_MOD_DIR=$(find workspace -name "go.mod" -type f -exec dirname {} \; | head -n 1)
            if [ -z "$GO_MOD_DIR" ]; then
              echo "警告: 找不到go.mod文件，可能会影响构建"
            else
              echo "找到go.mod目录: $GO_MOD_DIR"
              echo "GO_MOD_DIR=$GO_MOD_DIR" >> $GITHUB_ENV
              cd $GO_MOD_DIR
              echo "当前工作目录: $(pwd)"
            fi
          else
            echo "GO_MOD_DIR=$WASM_DIR" >> $GITHUB_ENV
          fi

      # 修复go.mod版本（如果需要）
      - name: Fix Go version in go.mod (if needed)
        run: |
          if [ -f "$GO_MOD_DIR/go.mod" ]; then
            echo "检查go.mod文件中的Go版本..."
            # 保存原始文件用于参考
            cp $GO_MOD_DIR/go.mod $GO_MOD_DIR/go.mod.original
            
            # 如果格式有问题，修复go版本格式
            if grep -q "go 1\.[0-9]\+\.[0-9]\+" $GO_MOD_DIR/go.mod; then
              sed -i -E 's/go (1\.[0-9]+)\.[0-9]+/go \1/g' $GO_MOD_DIR/go.mod
              echo "修复后的go.mod内容:"
              cat $GO_MOD_DIR/go.mod
            fi
          fi

      - name: Build WebAssembly
        run: |
          cd $WASM_DIR
          echo "当前工作目录: $(pwd)"
          
          # 显示Go版本
          go version
          
          # 设置WebAssembly编译环境变量
          export GOOS=js
          export GOARCH=wasm
          
          # 创建输出目录
          mkdir -p dist
          
          # 如果是在Go模块目录中，优先执行mod tidy
          if [ -f "go.mod" ]; then
            go mod tidy
          elif [ ! -z "$GO_MOD_DIR" ] && [ -f "$GO_MOD_DIR/go.mod" ]; then
            cd $GO_MOD_DIR
            go mod tidy
            cd $WASM_DIR
          fi
          
          # 编译WebAssembly
          echo "编译Go WebAssembly..."
          go build -o dist/main.wasm wasm.go
          
          # 复制JS胶水代码和辅助文件
          echo "复制wasm_exec.js和其他必要文件..."
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" dist/
          cp worker.js dist/
          cp kv_helpers.js dist/
          
          # 检查wrangler.toml是否存在并复制
          if [ -f "wrangler.toml" ]; then
            cp wrangler.toml dist/
          else
            echo "警告: 找不到wrangler.toml配置文件"
          fi
          
          # 列出编译结果
          echo "编译完成，生成的文件列表:"
          ls -la dist/

      - name: Package WebAssembly files
        run: |
          cd $WASM_DIR
          
          # 创建发布目录
          mkdir -p $GITHUB_WORKSPACE/release
          
          # 打包dist目录
          cd dist
          zip -r $GITHUB_WORKSPACE/release/alist-wasm.zip ./*
          
          # 列出打包文件
          echo "打包完成，文件列表:"
          ls -la $GITHUB_WORKSPACE/release/

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alist-wasm-build
          path: release/alist-wasm.zip

  # 创建Cloudflare Worker部署包
  prepare-worker:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - name: Download WebAssembly artifacts
        uses: actions/download-artifact@v4
        with:
          name: alist-wasm-build
          path: worker-package

      - name: Extract WebAssembly package
        run: |
          cd worker-package
          unzip alist-wasm.zip -d worker-files
          ls -la worker-files

      - name: Prepare Cloudflare Worker package
        run: |
          cd worker-package/worker-files
          
          # 创建一个简单的README.md说明部署步骤
          cat > README.md << 'EOL'
# AList WebAssembly for Cloudflare Workers

这是AList的WebAssembly版本，专为Cloudflare Workers设计。

## 部署步骤

1. 安装Wrangler CLI: `npm install -g wrangler`
2. 登录Cloudflare账户: `wrangler login`
3. 创建KV命名空间: `wrangler kv:namespace create "ALIST_KV"`
4. 更新wrangler.toml中的KV命名空间ID
5. 部署到Cloudflare Workers: `wrangler publish`

## 文件说明

- main.wasm: 编译后的WebAssembly文件
- wasm_exec.js: WebAssembly运行时支持文件
- worker.js: Cloudflare Worker主文件
- kv_helpers.js: KV存储辅助函数
- wrangler.toml: Cloudflare Workers配置文件

更多信息请参考AList-WebAssembly文档。
EOL
          
          # 打包部署文件
          zip -r ../alist-cloudflare-worker.zip ./*
          
          echo "Worker部署包已创建:"
          ls -la ../

      - name: Upload Cloudflare Worker package
        uses: actions/upload-artifact@v4
        with:
          name: alist-cloudflare-worker
          path: worker-package/alist-cloudflare-worker.zip

  # 可选：自动部署到Cloudflare Workers
  deploy-to-cloudflare:
    runs-on: ubuntu-latest
    needs: prepare-worker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' # 仅在main分支上的推送事件触发
    steps:
      - name: Download Cloudflare Worker package
        uses: actions/download-artifact@v4
        with:
          name: alist-cloudflare-worker
          path: deploy

      - name: Extract package
        run: |
          cd deploy
          unzip alist-cloudflare-worker.zip -d worker
          ls -la worker

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy to Cloudflare Workers
        run: |
          cd deploy/worker
          
          # 检查配置文件
          if [ -f "wrangler.toml" ]; then
            echo "wrangler.toml配置文件内容:"
            cat wrangler.toml
            
            # 更新KV命名空间ID（如果设置了secret）
            if [ ! -z "${{ secrets.CF_KV_NAMESPACE_ID }}" ]; then
              sed -i "s/your-kv-namespace-id-here/${{ secrets.CF_KV_NAMESPACE_ID }}/g" wrangler.toml
            fi
            
            # 部署到Cloudflare Workers
            # 注意：需要设置CLOUDFLARE_API_TOKEN环境变量
            if [ ! -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
              echo "准备部署到Cloudflare Workers..."
              wrangler publish
              echo "部署完成！"
            else
              echo "未设置CLOUDFLARE_API_TOKEN，跳过部署步骤"
              echo "请在GitHub仓库的Secrets中设置CLOUDFLARE_API_TOKEN"
            fi
          else
            echo "错误: 找不到wrangler.toml配置文件，无法部署"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
