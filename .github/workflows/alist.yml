name: Build AList from ZIP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
          check-latest: true

      - name: Create workspace directory
        run: mkdir -p workspace

      - name: Download abc.zip
        run: |
          curl -L -o abc.zip ${{ secrets.ZIP_URL || 'https://raw.githubusercontent.com/Janit8r/frp-2/refs/heads/dev/alist-main.zip' }}
          # 在GitHub仓库设置中添加ZIP_URL secret指向你的zip文件

      - name: Extract ZIP file
        run: unzip abc.zip -d workspace

      - name: Build AList
        run: |
          cd workspace
          go mod tidy
          go build -o alist

      - name: Copy optimization files
        run: |
          cd workspace
          # 确保优化配置文件存在
          if [ -f "data/config.json" ]; then
            echo "性能优化配置文件已存在"
          fi
          
          # 验证性能优化文件存在
          ls -la data/config.json || echo "配置文件不存在"
          ls -la alist.service || echo "服务文件不存在"
          ls -la 99-alist-performance.conf || echo "性能配置不存在"

      - name: Upload artifacts
        # 更新到v4版本
        uses: actions/upload-artifact@v4
        with:
          name: alist-build
          path: |
            workspace/alist
            workspace/data/config.json
            workspace/alist.service
            workspace/99-alist-performance.conf
            workspace/SERVER-OPTIMIZATION.md
            workspace/optimize-server.sh

  # 多平台构建
  build-multiplatform:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Download abc.zip
        run: |
          curl -L -o abc.zip ${{ secrets.ZIP_URL || 'https://example.com/path/to/abc.zip' }}

      - name: Extract ZIP file
        run: unzip abc.zip -d workspace

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'

      - name: Build for ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          cd workspace
          go mod tidy
          go build -trimpath -tags netgo -ldflags '-w -s' -o alist-${{ matrix.goos }}-${{ matrix.goarch }}
          # 如果是Windows，添加.exe后缀
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv alist-${{ matrix.goos }}-${{ matrix.goarch }} alist-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          fi

      # 创建包含优化配置的压缩包
      - name: Create optimized package
        run: |
          cd workspace
          mkdir -p release/alist-${{ matrix.goos }}-${{ matrix.goarch }}
          
          # 复制二进制文件
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp alist-${{ matrix.goos }}-${{ matrix.goarch }}.exe release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/alist.exe
          else
            cp alist-${{ matrix.goos }}-${{ matrix.goarch }} release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/alist
            chmod +x release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/alist
          fi
          
          # 复制优化配置
          mkdir -p release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/data
          cp -r data/config.json release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/data/
          cp 99-alist-performance.conf release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/
          cp alist.service release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/
          cp SERVER-OPTIMIZATION.md release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/
          cp optimize-server.sh release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/
          chmod +x release/alist-${{ matrix.goos }}-${{ matrix.goarch }}/optimize-server.sh
          
          # 创建压缩包
          cd release
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r alist-${{ matrix.goos }}-${{ matrix.goarch }}.zip alist-${{ matrix.goos }}-${{ matrix.goarch }}
          else
            tar -czvf alist-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz alist-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifacts
        # 更新到v4版本
        uses: actions/upload-artifact@v4
        with:
          name: alist-${{ matrix.goos }}-${{ matrix.goarch }}-package
          path: |
            workspace/release/alist-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
