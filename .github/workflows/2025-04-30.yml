name: Build on 2025-04-30

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      REPO_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create directories
        run: |
          mkdir -p deps
          mkdir -p artifacts
          mkdir -p build

      - name: Print environment info
        run: |
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "GitHub workspace: ${{ github.workspace }}"
          Write-Host "Files in current directory:"
          Get-ChildItem -Path . | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "CMake version:"
          cmake --version
          Write-Host "Compiler information:"
          cl.exe 2>&1 | Select-String -Pattern "Version" -SimpleMatch

      - name: Download dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutputFile,
              [int]$MaxRetries = 3
            )
            
            $retryCount = 0
            $success = $false
            
            while (-not $success -and $retryCount -lt $MaxRetries) {
              try {
                Write-Host "Downloading $Url to $OutputFile (Attempt $(($retryCount + 1)))"
                Invoke-WebRequest -Uri $Url -OutFile $OutputFile -UseBasicParsing
                $success = $true
                Write-Host "Download successful!"
              }
              catch {
                $retryCount++
                Write-Host "Download failed: $_"
                Write-Host "Retrying in 5 seconds..."
                Start-Sleep -Seconds 5
              }
            }
            
            if (-not $success) {
              throw "Failed to download after $MaxRetries attempts."
            }
          }
          
          Download-WithRetry -Url "https://github.com/Janit8r/device_lge_judyln/raw/S/gcc.zip" -OutputFile "deps/gcc.zip"
          Download-WithRetry -Url "https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win9900.zip" -OutputFile "deps/redis.zip"
        shell: pwsh

      - name: Extract dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Extracting dependencies..."
          
          try {
            Expand-Archive -Path deps/gcc.zip -DestinationPath deps/gcc -Force
            Expand-Archive -Path deps/redis.zip -DestinationPath ${{ github.workspace }} -Force
            Write-Host "Extraction completed successfully."
            
            # Verify extracted content
            Write-Host "Content of deps/gcc:"
            Get-ChildItem -Path deps/gcc -Recurse -Depth 1 | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          catch {
            Write-Host "Error during extraction: $_"
            exit 1
          }
        shell: pwsh

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.20.x'

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          
          ./bootstrap-vcpkg.bat
          
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_DISABLE_METRICS = "true"
          
          ./vcpkg install libuv:x64-windows-static openssl:x64-windows-static hwloc:x64-windows-static
          
          ./vcpkg integrate install
          
          Write-Host "Installed packages:"
          ./vcpkg list
        shell: pwsh

      - name: Print directory structure
        run: |
          Write-Host "Root directory structure:"
          Get-ChildItem -Path . | ForEach-Object { Write-Host "  $($_.Name)" }
          
          if (Test-Path "src") {
            Write-Host "Content of src directory:"
            Get-ChildItem -Path src | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          
          if (Test-Path "cmake") {
            Write-Host "Content of cmake directory:"
            Get-ChildItem -Path cmake | ForEach-Object { Write-Host "  $($_.Name)" }
          }
        shell: pwsh

      - name: Full CMake build
        run: |
          cd build
          
          # Set paths
          $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
          $vcpkgPath = "${{ github.workspace }}/vcpkg" -replace '\\', '/'
          Write-Host "Using XMRIG_DEPS path: $xmrigDepsPath"
          Write-Host "Using vcpkg path: $vcpkgPath"
          
          # Configure with more detailed output
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configure failed with exit code $LASTEXITCODE"
            if (Test-Path "CMakeFiles/CMakeError.log") {
              Write-Host "CMake error log:"
              Get-Content "CMakeFiles/CMakeError.log" | ForEach-Object { Write-Host $_ }
            }
            exit $LASTEXITCODE
          }
          
          # Build with maximum logging
          cmake --build . --config Release --verbose
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          
          # Check for build artifacts
          Write-Host "Build artifacts:"
          if (Test-Path "Release") {
            Get-ChildItem -Path "Release" | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Get-ChildItem -Path . -Include "*.exe", "*.dll" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          }
        shell: pwsh
        continue-on-error: false

      - name: Alternative build with NMake
        if: failure()
        run: |
          cd build
          Remove-Item -Recurse -Force *
          
          $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
          $vcpkgPath = "${{ github.workspace }}/vcpkg" -replace '\\', '/'
          
          # Use NMake with static linkage
          cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake" -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_TLS=OFF -DMSVC_RUNTIME=static
          
          nmake
          
          # Check for build artifacts
          Get-ChildItem -Path . -Include "*.exe", "*.dll" | ForEach-Object { 
            Write-Host "Found: $($_.FullName)"
          }
        shell: pwsh
        continue-on-error: true

      - name: Collect build artifacts
        run: |
          # Create artifacts directory if it doesn't exist
          if (-not (Test-Path "artifacts")) {
            mkdir -Force artifacts
          }
          
          # Search for executables and DLLs in all possible build directories
          $exeFiles = Get-ChildItem -Path ${{ github.workspace }} -Include "*.exe" -Recurse -File
          $dllFiles = Get-ChildItem -Path ${{ github.workspace }} -Include "*.dll" -Recurse -File | Where-Object { $_.DirectoryName -notlike "*vcpkg*" }
          
          foreach ($file in $exeFiles) {
            Write-Host "Found executable: $($file.FullName)"
            Copy-Item -Path $file.FullName -Destination "artifacts/" -Force
          }
          
          # Copy required DLLs
          if ($exeFiles.Count -gt 0) {
            # Copy vcpkg DLLs only if we found executables
            Copy-Item -Path "vcpkg/installed/x64-windows/bin/*.dll" -Destination "artifacts/" -Force -ErrorAction SilentlyContinue
          }
          
          # Copy our own DLLs
          foreach ($file in $dllFiles) {
            Write-Host "Found DLL: $($file.FullName)"
            Copy-Item -Path $file.FullName -Destination "artifacts/" -Force
          }
          
          # Verify artifacts
          $artifactFiles = Get-ChildItem -Path "artifacts"
          Write-Host "Total artifacts found: $($artifactFiles.Count)"
          if ($artifactFiles.Count -gt 0) {
            Write-Host "Artifacts:"
            $artifactFiles | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "No artifacts found!"
          }
        shell: pwsh
        continue-on-error: true

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
