name: Build on Do new re

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 安装 MSYS2 及所需工具链
      - name: Set up MSYS2 with GCC, CMake, HWLOC, and make
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-hwloc
            mingw-w64-x86_64-make
            unzip
            mingw-w64-x86_64-nasm
            curl

      # 创建build目录
      - name: Create build directory
        shell: msys2 {0}
        run: mkdir -p redis-D-Win996/build

      # 配置和构建项目
      - name: Configure and build project
        shell: msys2 {0}
        run: |
          cd redis-D-Win996
          cd build
          cmake .. -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_SECURITY=ON \
            -DWITH_C_SECURITY=ON \
            -DCMAKE_CXX_FLAGS='-fpermissive -Wno-write-strings -Wno-deprecated -Wno-unused-variable -Wno-unused-value -Wno-variadic-macros' \
            -DCMAKE_C_FLAGS='-Wno-pointer-to-int-cast -Wno-int-to-pointer-cast -Wno-incompatible-pointer-types -Wno-unknown-pragmas -Wno-format -Wno-narrowing -Wno-format-security'
          make -j$(nproc) VERBOSE=1

      # 复制构建产物
      - name: Copy build artifacts
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cp redis-D-Win996/build/*.exe artifacts/ || echo "No exe files found"
          cp redis-D-Win996/build/*.dll artifacts/ || echo "No DLL files found"

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redis-D-Win996-binaries
          path: artifacts/
          retention-days: 7
