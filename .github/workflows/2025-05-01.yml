name: Build on 2025-05-01

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      REPO_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          # 确保检出到正确的分支
          ref: main

      # Setup CMake
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.23.x'

      # Install MSVC build tools
      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # Create build directories
      - name: Create directories
        run: |
          mkdir -p deps
          mkdir -p artifacts
          mkdir -p build

      # Print environment info and list the directory
      - name: Print environment info
        run: |
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "GitHub workspace: ${{ github.workspace }}"
          Write-Host "CMake version:"
          cmake --version
          Write-Host "Compiler information:"
          cl.exe 2>&1 | Select-String -Pattern "Version" -SimpleMatch
          Write-Host "Directory contents:"
          Get-ChildItem -Path ${{ github.workspace }} -Force
          if (Test-Path ${{ github.workspace }}/CMakeLists.txt) {
            Write-Host "CMakeLists.txt found in workspace root"
          } else {
            Write-Host "CMakeLists.txt NOT found in workspace root!"
            # 查找CMakeLists.txt文件
            $cmakeFiles = Get-ChildItem -Path ${{ github.workspace }} -Recurse -Filter "CMakeLists.txt" | Select-Object -First 5
            if ($cmakeFiles) {
              Write-Host "Found CMakeLists.txt files at:"
              $cmakeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }
        shell: pwsh

      # Download dependencies with retry mechanism
      - name: Download dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'  # Speeds up downloads
          
          # Function to download with retry
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutputFile,
              [int]$MaxRetries = 3
            )
            
            $retryCount = 0
            $success = $false
            
            while (-not $success -and $retryCount -lt $MaxRetries) {
              try {
                Write-Host "Downloading $Url to $OutputFile (Attempt $(($retryCount + 1)))"
                Invoke-WebRequest -Uri $Url -OutFile $OutputFile -UseBasicParsing
                $success = $true
                Write-Host "Download successful!"
              }
              catch {
                $retryCount++
                Write-Host "Download failed: $_"
                Write-Host "Retrying in 5 seconds..."
                Start-Sleep -Seconds 5
              }
            }
            
            if (-not $success) {
              throw "Failed to download after $MaxRetries attempts."
            }
          }
          
          # Download required files
          Download-WithRetry -Url "https://github.com/Janit8r/device_lge_judyln/raw/S/gcc.zip" -OutputFile "deps/gcc.zip"
          Download-WithRetry -Url "https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win9900.zip" -OutputFile "deps/redis.zip"
        shell: pwsh

      # Extract dependencies
      - name: Extract dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'  # Speeds up extraction
          Write-Host "Extracting dependencies..."
          
          # Extract with error handling
          try {
            Expand-Archive -Path deps/gcc.zip -DestinationPath deps/gcc -Force
            Expand-Archive -Path deps/redis.zip -DestinationPath deps/redis -Force
            Write-Host "Dependencies extracted successfully."
          }
          catch {
            Write-Host "Error extracting dependencies: $_"
            exit 1
          }
        shell: pwsh

      # Build with CMake
      - name: Build with CMake
        run: |
          # 创建并进入构建目录
          cd build
          
          # 确认当前目录和上级目录
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Parent directory contents:"
          Get-ChildItem -Path ..

          # 正确设置CMake依赖路径 - 使用绝对路径
          $depsPath = Join-Path ${{ github.workspace }} "deps"
          Write-Host "Using deps path: $depsPath"
          
          # 检查CMakeLists.txt位置
          if (!(Test-Path "../CMakeLists.txt")) {
            Write-Host "Error: CMakeLists.txt not found in parent directory!"
            exit 1
          }
          
          # 使用正确的语法配置CMake
          cmake .. -G "Visual Studio 17 2022" -A x64 "-DXMRIG_DEPS=$depsPath"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed"
            exit 1
          }
          
          cmake --build . --config Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed"
            exit 1
          }
        shell: pwsh

      # Copy build artifacts to artifacts directory
      - name: Copy artifacts
        run: |
          # Create list of files to copy
          $filesToCopy = @(
            "build/Release/xmrig.exe",
            "build/Release/*.dll"
          )
          
          # Copy each file
          foreach ($file in $filesToCopy) {
            $fileMatches = Get-ChildItem -Path $file -ErrorAction SilentlyContinue
            if ($fileMatches) {
              foreach ($match in $fileMatches) {
                Write-Host "Copying $match to artifacts directory"
                Copy-Item -Path $match -Destination artifacts/ -Force
              }
            } else {
              Write-Host "Warning: No files found matching pattern $file"
            }
          }
          
          # Check what files were copied to artifacts
          Write-Host "Files in artifacts directory:"
          Get-ChildItem -Path artifacts/
        shell: pwsh

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
