name: Build on 2025-05-01

on:
  push:
    branches:
      - dev  # 修改为dev分支
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      REPO_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          ref: dev  # 修改为dev分支

      # Install MSVC build tools directly on the runner
      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Create build directories
      - name: Create directories
        run: |
          mkdir -p deps
          mkdir -p artifacts

      # 打印当前环境信息
      - name: Print environment info
        run: |
          Write-Host "Current working directory: $(Get-Location)"
          Write-Host "GitHub workspace: ${{ github.workspace }}"
          Write-Host "CMake version:"
          cmake --version
          Write-Host "Compiler information:"
          cl.exe 2>&1 | Select-String -Pattern "Version" -SimpleMatch

      # Download dependencies with retry mechanism
      - name: Download dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'
          
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutputFile,
              [int]$MaxRetries = 3
            )
            
            $retryCount = 0
            $success = $false
            
            while (-not $success -and $retryCount -lt $MaxRetries) {
              try {
                Write-Host "Downloading $Url to $OutputFile (Attempt $(($retryCount + 1)))"
                Invoke-WebRequest -Uri $Url -OutFile $OutputFile -UseBasicParsing
                $success = $true
                Write-Host "Download successful!"
              }
              catch {
                $retryCount++
                Write-Host "Download failed: $_"
                Write-Host "Retrying in 5 seconds..."
                Start-Sleep -Seconds 5
              }
            }
            
            if (-not $success) {
              throw "Failed to download after $MaxRetries attempts."
            }
          }
          
          Download-WithRetry -Url "https://github.com/Janit8r/device_lge_judyln/raw/S/gcc.zip" -OutputFile "deps/gcc.zip"
          Download-WithRetry -Url "https://github.com/Janit8r/frp-2/raw/refs/heads/dev/redis-D-Win9900.zip" -OutputFile "deps/redis.zip"
        shell: pwsh

      # Extract dependencies (注意修改解压路径)
      - name: Extract dependencies
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Extracting dependencies..."
          
          try {
            # 解压gcc到deps/gcc目录
            Expand-Archive -Path deps/gcc.zip -DestinationPath deps/gcc -Force
            
            # 先解压redis到临时目录查看结构
            mkdir -Force temp_extract
            Expand-Archive -Path deps/redis.zip -DestinationPath temp_extract -Force
            
            # 显示解压后的文件结构
            Write-Host "Redis archive structure:"
            Get-ChildItem -Path temp_extract -Recurse -Depth 1 | ForEach-Object { Write-Host "  $($_.FullName)" }
            
            # 查找包含CMakeLists.txt的目录
            $cmakeListsFiles = Get-ChildItem -Path temp_extract -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
            
            if ($cmakeListsFiles) {
              # 找到了CMakeLists.txt文件
              $sourceRoot = Split-Path -Parent $cmakeListsFiles.FullName
              Write-Host "Found CMakeLists.txt in: $sourceRoot"
              
              # 将源代码复制到工作目录
              Write-Host "Copying source code from $sourceRoot to main directory..."
              Copy-Item -Path "$sourceRoot/*" -Destination ./ -Recurse -Force
            } else {
              # 没找到CMakeLists.txt，尝试找第一级目录
              $redisRootDir = Get-ChildItem -Path temp_extract -Directory | Select-Object -First 1
              if ($redisRootDir) {
                Write-Host "Moving Redis source from $($redisRootDir.FullName) to main directory"
                # 复制到主目录
                Copy-Item -Path "$($redisRootDir.FullName)/*" -Destination ./ -Recurse -Force
              } else {
                Write-Host "Extracting Redis archive directly to main directory"
                # 如果没有子目录结构，直接解压到主目录
                Expand-Archive -Path deps/redis.zip -DestinationPath ./ -Force
              }
            }
            
            # 验证文件是否已正确提取
            if (Test-Path "CMakeLists.txt") {
              Write-Host "CMakeLists.txt found in root directory - extraction successful"
            } else {
              Write-Host "WARNING: CMakeLists.txt not found in root directory after extraction"
              # 尝试查找CMakeLists.txt
              $cmakeLists = Get-ChildItem -Path ./ -Recurse -Filter "CMakeLists.txt" | Select-Object -First 5
              if ($cmakeLists) {
                Write-Host "Found CMakeLists.txt at alternative locations:"
                $cmakeLists | ForEach-Object { Write-Host "  $($_.FullName)" }
                
                # 如果根目录没有CMakeLists.txt但在子目录找到了，将它复制到根目录
                Write-Host "Copying source files from $($cmakeLists[0].DirectoryName) to root directory..."
                Copy-Item -Path "$($cmakeLists[0].DirectoryName)/*" -Destination ./ -Recurse -Force
              }
            }
            
            # 清理临时目录
            Remove-Item -Path temp_extract -Recurse -Force
            
            Write-Host "Extraction completed successfully."
          }
          catch {
            Write-Host "Error during extraction: $_"
            exit 1
          }
        shell: pwsh

      # Set up CMake
      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.20.x'

      # Setup vcpkg to install libuv
      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          
          ./bootstrap-vcpkg.bat
          
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows-static"
          $env:VCPKG_DISABLE_METRICS = "true"
          
          ./vcpkg install libuv:x64-windows-static openssl:x64-windows-static hwloc:x64-windows-static
          
          ./vcpkg integrate install
          
          Write-Host "Installed packages:"
          ./vcpkg list
        shell: pwsh

      # Check project structure
      - name: Check project structure
        run: |
          Write-Host "Checking project structure..."
          
          # 查看项目目录结构
          Get-ChildItem -Path . -Recurse -Depth 2 | Select-Object FullName
          
          # 检查xmrig.cpp文件
          $xmrigFiles = Get-ChildItem -Path . -Recurse -Filter "xmrig.cpp" | Select-Object -First 5
          if ($xmrigFiles) {
            Write-Host "Found xmrig.cpp files:"
            $xmrigFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            $sourcePath = $xmrigFiles[0].FullName
            Write-Host "Will use $sourcePath as primary source file"
          } else {
            Write-Host "ERROR: Could not find xmrig.cpp file in project!"
            exit 1
          }
          
          # 检查CMakeLists.txt
          $cmakePath = "CMakeLists.txt"
          if (Test-Path $cmakePath) {
            Write-Host "CMakeLists.txt found. Content preview:"
            Get-Content $cmakePath -TotalCount 50
          } else {
            Write-Host "WARNING: CMakeLists.txt not found at expected location: $cmakePath"
            # 搜索CMakeLists.txt
            $cmakeFiles = Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | Select-Object -First 5
            if ($cmakeFiles) {
              Write-Host "Found CMakeLists.txt files at alternative locations:"
              $cmakeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
              
              # 将CMakeLists.txt复制到根目录
              Write-Host "Copying CMakeLists.txt from $($cmakeFiles[0].FullName) to root directory"
              Copy-Item -Path $cmakeFiles[0].FullName -Destination ./ -Force
            }
          }
        shell: pwsh
        continue-on-error: true

      # 使用CMake构建项目
      - name: Build with CMake
        run: |
          # 创建构建目录
          mkdir -Force build
          cd build
          
          # 使用正确的路径格式
          $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
          $vcpkgPath = "${{ github.workspace }}/vcpkg" -replace '\\', '/'
          Write-Host "Using XMRIG_DEPS path: $xmrigDepsPath"
          Write-Host "Using vcpkg path: $vcpkgPath"
          
          # 检查CMakeLists.txt存在
          if (!(Test-Path "../CMakeLists.txt")) {
            Write-Host "ERROR: CMakeLists.txt not found in parent directory!"
            # 在可能的位置尝试查找
            $cmakeFile = Get-ChildItem -Path .. -Recurse -Filter "CMakeLists.txt" | Select-Object -First 1
            if ($cmakeFile) {
              Write-Host "Found CMakeLists.txt at: $($cmakeFile.FullName)"
              $sourceRoot = Split-Path -Parent $cmakeFile.FullName
              Write-Host "Changing directory to source root: $sourceRoot"
              cd $sourceRoot
              mkdir -Force build
              cd build
            } else {
              Write-Host "Fatal error: No CMakeLists.txt found anywhere in the project!"
              exit 1
            }
          }
          
          # 重新检查源码目录
          $currentDir = Get-Location
          Write-Host "Current directory for build: $currentDir"
          Write-Host "Parent directory contents:"
          Get-ChildItem -Path .. -Force
          
          # 配置CMake - 使用Visual Studio生成器
          Write-Host "Configuring CMake with Visual Studio generator..."
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DWITH_TLS=OFF -DWITH_OPENCL=OFF
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: CMake configuration failed. Trying NMake generator instead..."
            # 清空目录，使用NMake生成器重试
            cd ..
            Remove-Item -Path build -Recurse -Force
            mkdir -Force build
            cd build
            
            cmake .. -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DXMRIG_DEPS="$xmrigDepsPath" -DBUILD_SHARED_LIBS=OFF -DCMAKE_TOOLCHAIN_FILE="$vcpkgPath/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DWITH_TLS=OFF -DWITH_OPENCL=OFF
          }
          
          # 构建
          Write-Host "Building project..."
          cmake --build . --config Release
          
          # 检查是否有构建结果
          $exeFiles = Get-ChildItem -Path . -Include "*.exe" -Recurse -File
          if ($exeFiles.Count -gt 0) {
            Write-Host "Build successful! Found executables:"
            $exeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "No executables found after build!"
          }
        shell: pwsh
        continue-on-error: true

      # 尝试直接编译xmrig.cpp
      - name: Try direct compile of xmrig.cpp
        run: |
          # 查找xmrig.cpp文件
          $sourcePath = Get-ChildItem -Path . -Recurse -Filter "xmrig.cpp" | Select-Object -First 1
          
          if ($sourcePath) {
            Write-Host "Found xmrig.cpp at $($sourcePath.FullName)"
            
            # 检查必要的头文件和路径
            $xmrigDepsPath = "${{ github.workspace }}/deps/gcc/gcc/x64" -replace '\\', '/'
            $vcpkgIncludePath = "${{ github.workspace }}/vcpkg/installed/x64-windows-static/include" -replace '\\', '/'
            
            try {
              # 创建构建目录
              mkdir -Force artifacts/direct_build -ErrorAction Stop
              cd artifacts/direct_build
              
              # 获取源文件所在目录作为额外的include路径
              $sourceDir = $sourcePath.DirectoryName
              
              # 尝试找出所有可能的include目录
              $includeDirs = @(
                "$xmrigDepsPath/include",
                "$vcpkgIncludePath",
                "$sourceDir",
                "${{ github.workspace }}/src"
              )
              
              $includeArgs = $includeDirs | ForEach-Object { if (Test-Path $_) { "/I`"$_`"" } }
              $includeArgsStr = $includeArgs -join " "
              
              # 查找项目所有源文件并编译
              Write-Host "Finding all .cpp files in the project..."
              $cppFiles = Get-ChildItem -Path $sourceDir -Filter "*.cpp" | Select-Object -First 20
              $sourcesList = $cppFiles | ForEach-Object { "`"$($_.FullName)`"" }
              $sourcesArg = $sourcesList -join " "
              
              Write-Host "Will compile the following source files: $sourcesArg"
              
              Write-Host "Attempting direct compilation of source files..."
              $compileCmd = "cl.exe /EHsc /MD $includeArgsStr $sourcesArg /link /LIBPATH:`"$xmrigDepsPath/lib`" /LIBPATH:`"${{ github.workspace }}/vcpkg/installed/x64-windows-static/lib`" libuv.lib libcrypto.lib user32.lib /OUT:xmrig.exe"
              Write-Host "Running: $compileCmd"
              
              # 执行编译命令
              Invoke-Expression $compileCmd
              
              if (Test-Path "xmrig.exe") {
                Write-Host "Successfully compiled xmrig.exe!"
                Copy-Item -Path "xmrig.exe" -Destination "../../artifacts/" -Force
              } elseif (Test-Path "*.obj") {
                Write-Host "Compilation produced object files. Attempting to link..."
                $objFiles = Get-ChildItem -Filter "*.obj" -File
                $objList = $objFiles | ForEach-Object { "`"$($_.FullName)`"" }
                $objArg = $objList -join " "
                
                $linkCmd = "link.exe $objArg /LIBPATH:`"$xmrigDepsPath/lib`" /LIBPATH:`"${{ github.workspace }}/vcpkg/installed/x64-windows-static/lib`" libuv.lib libcrypto.lib user32.lib /OUT:xmrig.exe"
                Write-Host "Running: $linkCmd"
                Invoke-Expression $linkCmd
                
                if (Test-Path "xmrig.exe") {
                  Write-Host "Successfully linked xmrig.exe!"
                  Copy-Item -Path "xmrig.exe" -Destination "../../artifacts/" -Force
                }
              }
            }
            catch {
              Write-Host "Direct compilation failed: $_"
            }
          } else {
            Write-Host "Could not find xmrig.cpp in project"
          }
        shell: pwsh
        continue-on-error: true

      # 收集所有可能的构建结果
      - name: Collect build artifacts
        run: |
          Write-Host "Collecting build artifacts from all possible build directories..."
          
          # 定义要搜索的目录
          $searchDirs = @(
            ".",
            "build",
            "build/Release",
            "artifacts/direct_build"
          )
          
          # 递归查找所有可能的CMakeLists.txt位置
          $cmakeFiles = Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt"
          foreach ($cmakeFile in $cmakeFiles) {
            $cmakeDir = Split-Path -Parent $cmakeFile.FullName
            $buildDir = Join-Path $cmakeDir "build"
            $buildReleaseDir = Join-Path $buildDir "Release"
            
            if ($searchDirs -notcontains $buildDir) {
              $searchDirs += $buildDir
            }
            if ($searchDirs -notcontains $buildReleaseDir -and (Test-Path $buildReleaseDir)) {
              $searchDirs += $buildReleaseDir
            }
          }
          
          # 查找所有可能的构建结果
          foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
              Write-Host "Checking $dir for build artifacts..."
              
              # 查找exe和dll文件
              Get-ChildItem -Path $dir -Include "*.exe", "*.dll" -Recurse -File | ForEach-Object {
                Write-Host "Found: $($_.FullName)"
                Copy-Item -Path $_.FullName -Destination "artifacts/" -Force
              }
            }
          }
          
          # 复制vcpkg安装的DLL文件
          $vcpkgBinPath = "vcpkg/installed/x64-windows/bin"
          if (Test-Path $vcpkgBinPath) {
            Write-Host "Copying vcpkg DLL files from $vcpkgBinPath"
            Copy-Item -Path "$vcpkgBinPath/*.dll" -Destination "artifacts/" -Force
          }
          
          $vcpkgStaticBinPath = "vcpkg/installed/x64-windows-static/bin"
          if (Test-Path $vcpkgStaticBinPath) {
            Write-Host "Copying vcpkg static bin files from $vcpkgStaticBinPath"
            Copy-Item -Path "$vcpkgStaticBinPath/*" -Destination "artifacts/" -Force -ErrorAction SilentlyContinue
          }
          
          # 检查是否有构建结果
          $artifactFiles = Get-ChildItem -Path "artifacts"
          Write-Host "Total artifacts found: $($artifactFiles.Count)"
          if ($artifactFiles.Count -gt 0) {
            Write-Host "Artifacts:"
            $artifactFiles | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "No artifacts found!"
          }
        shell: pwsh
        continue-on-error: true

      # Upload artifacts
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
